name: build-g0771

on:
  push:
    branches:
      - ums9230
    paths:
      - "arch/arm64/boot/dts/sprd/**"
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: Branch or commit to build (leave empty to build the pushed commit)
        required: false

env:
  BUSYBOX_VERSION: "1.36.1"
  BUSYBOX_SHA256: "b8cc24c9574d809e7279c3be349795c5d5ceb6fdf19ca709f80cde50e47de314"
  BUSYBOX_KEY_FPR: "C9E9416F76E610DBD09D040F47B70C55ACC9965B"
  MKBOOTIMG_REPO: "https://android.googlesource.com/platform/system/tools/mkbootimg"
  MKBOOTIMG_COMMIT: "d2bb0af5ba6d3198a3e99529c97eda1be0b5a093"

permissions:
  contents: read

concurrency:
  group: build-g0771-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            device-tree-compiler flex bison libssl-dev libelf-dev bc

      - name: Checkout kernel at this commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.kernel_ref || github.sha }}
          path: kernel
          fetch-depth: 1

      - name: Build Image and DTB
        working-directory: kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig

          # Options the bring-up needs: serial console, display stack, and initramfs support.
          cat >> .config <<'EOF'
          CONFIG_SERIAL_SPRD=y
          CONFIG_SERIAL_SPRD_CONSOLE=y
          CONFIG_DRM=y
          CONFIG_DRM_SPRD=y
          CONFIG_DRM_FBDEV_EMULATION=y
          CONFIG_FB=y
          EOF
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          # Record the state of every option, then fail if a required one is off.
          mkdir -p ../out
          : > ../out/kernel-config-check.txt
          for sym in CONFIG_SERIAL_SPRD CONFIG_SERIAL_SPRD_CONSOLE CONFIG_TTY \
                     CONFIG_BLK_DEV_INITRD CONFIG_DEVTMPFS CONFIG_DEVTMPFS_MOUNT \
                     CONFIG_PROC_FS CONFIG_SYSFS \
                     CONFIG_DRM CONFIG_DRM_SPRD CONFIG_DRM_FBDEV_EMULATION CONFIG_FB; do
            line=$(grep -E "^${sym}=|^# ${sym} is not set" .config || true)
            [ -n "$line" ] || line="${sym} missing"
            echo "$line" >> ../out/kernel-config-check.txt
          done
          cat ../out/kernel-config-check.txt

          required="CONFIG_SERIAL_SPRD CONFIG_SERIAL_SPRD_CONSOLE CONFIG_DRM_SPRD"
          for sym in $required; do
            if ! grep -q "^${sym}=y" .config; then
              echo "::error::${sym} is not enabled. Check ../out/kernel-config-check.txt"
              grep -n -B2 -A10 "config ${sym#CONFIG_}" drivers/tty/serial/Kconfig \
                drivers/gpu/drm/sprd/Kconfig 2>/dev/null || true
              exit 1
            fi
          done

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" \
            Image sprd/ums9230-blu-g0771.dtb 2>&1 | tee build.log
          git rev-parse HEAD > ../out/kernel-commit.txt
          cp arch/arm64/boot/Image ../out/
          cp arch/arm64/boot/dts/sprd/ums9230-blu-g0771.dtb ../out/
          cp build.log ../out/

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: out/
          retention-days: 14

  pack:
    needs: kernel
    runs-on: ubuntu-24.04
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Download kernel artifacts
        uses: actions/download-artifact@v4
        with:
          name: kernel-out
          path: out

      - name: Download busybox, signature, and key
        run: |
          curl -fsSL -o busybox.tar.bz2 \
            "https://busybox.net/downloads/busybox-${BUSYBOX_VERSION}.tar.bz2"
          curl -fsSL -o busybox.tar.bz2.sig \
            "https://busybox.net/downloads/busybox-${BUSYBOX_VERSION}.tar.bz2.sig"
          curl -fsSL -o vda_pubkey.gpg \
            "https://busybox.net/~vda/vda_pubkey.gpg"

      - name: Verify busybox SHA-256
        run: echo "${BUSYBOX_SHA256}  busybox.tar.bz2" | sha256sum -c -

      - name: Verify busybox signature and key fingerprint
        run: |
          gpg --batch --import vda_pubkey.gpg
          gpg --batch --status-fd 1 --verify busybox.tar.bz2.sig busybox.tar.bz2 > gpg-status.txt
          grep -q "VALIDSIG ${BUSYBOX_KEY_FPR}" gpg-status.txt

      - name: Build static busybox
        run: |
          tar xf busybox.tar.bz2
          cd "busybox-${BUSYBOX_VERSION}"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          sed -i 's/^CONFIG_TC=y/# CONFIG_TC is not set/' .config
          sed -i 's/# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          grep -q '^# CONFIG_TC is not set' .config
          grep -q '^CONFIG_STATIC=y' .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)"
          grep -q '^CONFIG_STATIC=y' .config
          file busybox | grep -q "statically linked"
          cp busybox "$GITHUB_WORKSPACE/busybox"

      - name: Fetch mkbootimg at pinned commit
        run: |
          git clone "${MKBOOTIMG_REPO}" mkbootimg
          cd mkbootimg
          test "$(git cat-file -t "${MKBOOTIMG_COMMIT}")" = "commit"
          git checkout "${MKBOOTIMG_COMMIT}"
          test "$(git rev-parse HEAD)" = "${MKBOOTIMG_COMMIT}"

      - name: Build initramfs
        run: |
          mkdir -p ramdisk/bin ramdisk/sbin ramdisk/dev ramdisk/proc ramdisk/sys ramdisk/tmp
          cp busybox ramdisk/bin/busybox
          chmod +x ramdisk/bin/busybox
          for applet in sh mount umount echo cat ls ps dmesg reboot poweroff sleep stty; do
            ln -sf busybox "ramdisk/bin/${applet}"
          done

          # Device nodes the kernel needs before the shell can attach to a terminal
          sudo mknod -m 600 ramdisk/dev/console c 5 1
          sudo mknod -m 666 ramdisk/dev/null c 1 3
          sudo mknod -m 666 ramdisk/dev/tty c 5 0
          sudo mknod -m 666 ramdisk/dev/ttyS0 c 4 64
          sudo mknod -m 666 ramdisk/dev/ttyS1 c 4 65
          sudo chown root:root ramdisk/dev/*

          # Init script: mount basic filesystems, then give the shell the console
          cat > ramdisk/init <<'EOF'
          #!/bin/sh
          mount -t proc proc /proc
          mount -t sysfs sys /sys
          mount -t devtmpfs devtmpfs /dev 2>/dev/null
          echo
          echo "G0771 bringup shell. Type commands below."
          echo
          exec /bin/sh </dev/console >/dev/console 2>&1
          EOF
          chmod +x ramdisk/init

          (cd ramdisk && find . | cpio -H newc -o | gzip -9) > initramfs.cpio.gz

      - name: Pack boot.img
        run: |
          python3 mkbootimg/mkbootimg.py --header_version 2 \
            --kernel out/Image --ramdisk initramfs.cpio.gz \
            --dtb out/ums9230-blu-g0771.dtb --base 0 \
            --kernel_offset 0x00008000 --ramdisk_offset 0x05400000 \
            --dtb_offset 0x01f00000 --pagesize 4096 \
            --cmdline "console=ttyS1,115200n8 earlycon=sprd_serial,0x200b0000 loglevel=8 panic=10 rdinit=/init" \
            --os_version 13 --os_patch_level 2026-10 \
            --output boot.img
          sha256sum boot.img out/Image out/ums9230-blu-g0771.dtb out/kernel-commit.txt > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: boot-img
          path: |
            boot.img
            SHA256SUMS
          retention-days: 14
